# Publishes the static site to GitHub Pages. Asset URLs get the commit hash appended (?v=__V__ placeholders),
# so browsers never mix a cached old index.html with a new app.js after an update.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html style.css app.js rules.js _site/
          sed -i "s/__V__/${GITHUB_SHA::8}/g" _site/index.html _site/app.js
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
